{% extends "layout.html" %}
{% block content %}
<div>
    {% for testshard in testshards %}
    <div class="card p-1 m-3">
        <div class="card-body">
            <h5 class="card-title">{{ testshard.name }}</h5>
            <p class="card-text text-muted">{{ testshard.number }}</p>
            <p class="card-text">{{ testshard.result }}</p>
            <p class="card-text">{{ testshard.date }}</p>
        </div>
    </div>
    {% endfor %}
    <div class="row p-3">
        <div class="col-6">
            {{ pagination.info }}
        </div>
        <div class="col-6" style="display: flex; justify-content: end;">
            {{ pagination.links }}
        </div>

    </div>

</div>
{% endblock %}
